<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" style="background:#ffffff" role="img" aria-label="Neuromem memory loop: capture, background dream cycle, and retrieval">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6a63"/>
    </marker>
    <style>
      text{font-family:Inter,system-ui,-apple-system,sans-serif;fill:#1c1b19}
      .t{font-size:15px;font-weight:600}
      .s{font-size:12.5px;fill:#6e6a63}
      .lane{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#6e6a63}
      .box{fill:#f2efe8;stroke:#d8d3c8;stroke-width:1}
      .hot{fill:#e8eef9;stroke:#b9c8e6;stroke-width:1}
      .store{fill:#ffffff;stroke:#2451a6;stroke-width:1.5}
      .e{stroke:#6e6a63;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#6e6a63;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
    </style>
  </defs>

  <text class="lane" x="24" y="34">WHILE THE AGENT TALKS</text>
  <text class="lane" x="24" y="246">IN THE BACKGROUND: DREAM CYCLE</text>
  <line x1="24" y1="214" x2="876" y2="214" stroke="#e6e2da"/>

  <rect class="hot" x="24" y="54" width="200" height="72" rx="8"/>
  <text class="t" x="40" y="82">Capture</text>
  <text class="s" x="40" y="104">Each turn is queued raw.</text>
  <text class="s" x="40" y="120">Hippocampus</text>

  <rect class="store" x="350" y="54" width="200" height="120" rx="8"/>
  <text class="t" x="366" y="82">Concept tree</text>
  <text class="s" x="366" y="104">Memories, tags and named</text>
  <text class="s" x="366" y="120">clusters, with a summary</text>
  <text class="s" x="366" y="136">at each junction.</text>
  <text class="s" x="366" y="160">SQLite by default</text>

  <rect class="hot" x="676" y="54" width="200" height="120" rx="8"/>
  <text class="t" x="692" y="82">Retrieve</text>
  <text class="s" x="692" y="104">search_memory,</text>
  <text class="s" x="692" y="120">expand_node and</text>
  <text class="s" x="692" y="136">retrieve_memories.</text>
  <text class="s" x="692" y="160">Zero LLM calls.</text>

  <path class="e" d="M550,98 L676,98"/>
  <path class="d" d="M676,150 L552,150"/>
  <text class="s" x="572" y="142">recall (LTP)</text>

  <rect class="box" x="24" y="266" width="190" height="100" rx="8"/>
  <text class="t" x="40" y="294">Summarise</text>
  <text class="s" x="40" y="316">One summary per session,</text>
  <text class="s" x="40" y="332">told to keep personal facts,</text>
  <text class="s" x="40" y="348">names, numbers and dates.</text>

  <rect class="box" x="244" y="266" width="190" height="100" rx="8"/>
  <text class="t" x="260" y="294">Tag and embed</text>
  <text class="s" x="260" y="316">5 to 12 tags per memory,</text>
  <text class="s" x="260" y="332">then embeddings from the</text>
  <text class="s" x="260" y="348">chosen provider.</text>

  <rect class="box" x="464" y="266" width="190" height="100" rx="8"/>
  <text class="t" x="480" y="294">Cluster</text>
  <text class="s" x="480" y="316">HDBSCAN builds the tree.</text>
  <text class="s" x="480" y="332">Clusters are named lazily.</text>
  <text class="s" x="480" y="348">Neocortex</text>

  <rect class="box" x="684" y="266" width="192" height="100" rx="8"/>
  <text class="t" x="700" y="294">Prune</text>
  <text class="s" x="700" y="316">Unused memories decay</text>
  <text class="s" x="700" y="332">and are archived below</text>
  <text class="s" x="700" y="348">a threshold. Pruning</text>

  <path class="e" d="M124,126 L124,264"/>
  <path class="e" d="M214,316 L242,316"/>
  <path class="e" d="M434,316 L462,316"/>
  <path class="e" d="M654,316 L682,316"/>
  <path class="e" d="M560,266 L520,176"/>
  <path class="e" d="M760,266 C760,220 600,214 540,176"/>

  <text class="s" x="24" y="404">The answer model receives the relevant part of the tree as context. Summaries, tags and names are all</text>
  <text class="s" x="24" y="422">computed in the background, so retrieval stays fast.</text>
</svg>
